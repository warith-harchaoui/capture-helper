<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1404 432" width="1404" height="432" role="img" aria-labelledby="ch-title ch-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="ch-title">Comment capture-helper fonctionne : la caméra et le micro, derrière le même contrat que le reste de la suite</title>
  <desc id="ch-desc">Une plaque de gauche à droite. Entrée : les caméras et les micros branchés sur cette machine. Le travail, en trois étapes numérotées : énumérer les périphériques de façon multiplateforme par les listes de ffmpeg, avfoundation sur macOS, dshow sur Windows et v4l2 avec pulse sur Linux ; en choisir un par fragment de nom ou par indice, en levant une erreur plutôt qu'en devinant si rien ne correspond ; puis le diffuser. Sortie : des images de caméra en tableaux numpy BGR hauteur par largeur par trois, le même contrat que l'itérateur d'images de video-helper, et des trames micro conformes à la trame PCM de podcast-helper.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="204" height="78" rx="10"/>
  <text class="n-title" x="130" y="120" text-anchor="middle">caméras et micros</text>
  <text class="n-sub" x="130" y="139" text-anchor="middle">branchés sur cette machine</text>
  <path class="flow" d="M238 126 H254" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="258" y="54" width="863" height="144" rx="12"/>
  <text class="panel-label" x="278" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="278" y="94" width="264" height="78" rx="10"/>
  <text class="n-title" x="410" y="127" text-anchor="middle">énumérer les sources</text>
  <text class="n-sub" x="410" y="146" text-anchor="middle">avfoundation / dshow / v4l2 + pulse</text>
  <text class="step" x="289" y="110">1</text>
  <path class="flow" d="M546 133 H562" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="568" y="94" width="263" height="78" rx="10"/>
  <text class="n-title" x="700" y="127" text-anchor="middle">choisir une source</text>
  <text class="n-sub" x="700" y="146" text-anchor="middle">par nom ou indice, jamais au hasard</text>
  <text class="step" x="579" y="110">2</text>
  <path class="flow" d="M835 133 H851" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="857" y="94" width="243" height="78" rx="10"/>
  <text class="n-title" x="979" y="127" text-anchor="middle">diffuser</text>
  <text class="n-sub" x="979" y="146" text-anchor="middle">images et audio, au fil de l'eau</text>
  <text class="step" x="868" y="110">3</text>
  <path class="flow" d="M1127 126 H1143" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1147" y="40">SORTIE</text>
  <rect class="io" x="1147" y="87" width="229" height="78" rx="10"/>
  <text class="n-title" x="1261" y="120" text-anchor="middle">images BGR, trames PCM</text>
  <text class="n-sub" x="1261" y="139" text-anchor="middle">le contrat de ses voisines</text>
  <rect class="core" x="492" y="232" width="420" height="54" rx="10"/>
  <text class="on-dark" x="702" y="253" text-anchor="middle">une bibliothèque, appelée pareil partout</text>
  <text class="on-dark-sub" x="702" y="272" text-anchor="middle">os-helper dessous pour la journalisation et les fichiers</text>
  <path class="tie" d="M702 286 V314 H438 V332"/>
  <path class="tie" d="M702 314 H966 V332"/>
  <path class="tie" d="M438 314 V332"/>
  <rect class="surface" x="363" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="438" y="360" text-anchor="middle">API Python</text>
  <path class="tie" d="M614 314 V332"/>
  <rect class="surface" x="539" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="614" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M790 314 V332"/>
  <rect class="surface" x="715" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="790" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M966 314 V332"/>
  <rect class="surface" x="891" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="966" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="702" y="412" text-anchor="middle">Les images sortent à la forme de video-helper et l'audio à celle de podcast-helper : une source de capture entre dans une chaîne écrite pour des fichiers.</text>
</svg>
