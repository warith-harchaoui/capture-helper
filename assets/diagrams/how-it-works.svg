<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1371 432" width="1371" height="432" role="img" aria-labelledby="ch-title ch-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="ch-title">How capture-helper works: the camera and the microphone, behind the same contract as the rest of the suite</title>
  <desc id="ch-desc">A left-to-right plate. In: the cameras and microphones attached to this machine. The work, in three numbered stages: enumerate the devices cross-platform through ffmpeg's device lists, avfoundation on macOS, dshow on Windows and v4l2 with pulse on Linux; pick one by name substring or index, raising rather than guessing when nothing matches; then stream it. Out: camera frames as height-by-width-by-three BGR unsigned-byte numpy arrays, the same contract as video-helper's frame iterator, and microphone frames matching podcast-helper's PCM frame. Underneath, the core object reached through the four surfaces every member exposes.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="191" height="78" rx="10"/>
  <text class="n-title" x="123" y="120" text-anchor="middle">cameras and mics</text>
  <text class="n-sub" x="123" y="139" text-anchor="middle">attached to this machine</text>
  <path class="flow" d="M225 126 H241" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="245" y="54" width="843" height="144" rx="12"/>
  <text class="panel-label" x="265" y="76">WHAT IT DOES</text>
  <rect class="stage" x="265" y="94" width="264" height="78" rx="10"/>
  <text class="n-title" x="397" y="127" text-anchor="middle">enumerate devices</text>
  <text class="n-sub" x="397" y="146" text-anchor="middle">avfoundation / dshow / v4l2 + pulse</text>
  <text class="step" x="276" y="110">1</text>
  <path class="flow" d="M533 133 H549" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="555" y="94" width="243" height="78" rx="10"/>
  <text class="n-title" x="677" y="127" text-anchor="middle">pick a source</text>
  <text class="n-sub" x="677" y="146" text-anchor="middle">by name or index, never by guess</text>
  <text class="step" x="566" y="110">2</text>
  <path class="flow" d="M803 133 H819" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="825" y="94" width="243" height="78" rx="10"/>
  <text class="n-title" x="946" y="127" text-anchor="middle">stream it</text>
  <text class="n-sub" x="946" y="146" text-anchor="middle">frames and audio, as they arrive</text>
  <text class="step" x="836" y="110">3</text>
  <path class="flow" d="M1094 126 H1110" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1114" y="40">OUT</text>
  <rect class="io" x="1114" y="87" width="229" height="78" rx="10"/>
  <text class="n-title" x="1228" y="120" text-anchor="middle">BGR frames, PCM frames</text>
  <text class="n-sub" x="1228" y="139" text-anchor="middle">same contract as its siblings</text>
  <rect class="core" x="470" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="686" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="686" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M686 286 V314 H422 V332"/>
  <path class="tie" d="M686 314 H950 V332"/>
  <path class="tie" d="M422 314 V332"/>
  <rect class="surface" x="347" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="422" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M598 314 V332"/>
  <rect class="surface" x="523" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="598" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M774 314 V332"/>
  <rect class="surface" x="699" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="774" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M950 314 V332"/>
  <rect class="surface" x="875" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="950" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="686" y="412" text-anchor="middle">Frames come out in video-helper's shape and audio in podcast-helper's, so a capture source drops into a pipeline written for files.</text>
</svg>
