# Human-language source of truth for capture-helper.
#
# `gui:` holds every string the scene-configurator page shows. Code refers to
# these keys; this file owns the wording. Read by `os_helper.Locales`, the
# loader shared across the suite (CODING.md 21.3).
#
# There is no `prompts:` section: this package talks to ffmpeg and the host's
# capture devices, not to a model.

meta:
  default_locale: fr
  supported_locales:
  - fr
  - en

gui:
  # --- head / header -------------------------------------------------------
  page_title:
    fr: Capture Helper — Configurateur de scène
    en: Capture Helper — Scene Configurator
  hero_title:
    fr: Capture Helper — Configurateur de scène
    en: Capture Helper — Scene Configurator
  hero_subtitle:
    fr: >-
      Configurateur de scène multi-sources en direct. Énumérez vos caméras et
      microphones, posez-les sur le canevas, prévisualisez-les en direct,
      arrangez, puis enregistrez le montage comme une scène réutilisable que
      la CLI et l'API rejouent. Tout en local — rien ne quitte votre machine.
    en: >-
      Live multi-source scene configurator. Enumerate your cameras &amp;
      microphones, drop them on the canvas, preview them live, arrange, then
      save the design as a reusable scene the CLI / API can replay.
      Local-first — nothing leaves your machine.
  scene_label:
    fr: Scène
    en: Scene
  scene_name_aria:
    fr: Nom de la scène
    en: Scene name
  # Not translated: this is the scene's stored name, written into the saved
  # artifact. Translating it would make the same scene carry two different
  # names depending on the language the page happened to be in.
  scene_name_default: untitled

  # --- left column: the device palette -------------------------------------
  devices_heading:
    fr: Appareils
    en: Devices
  refresh_button:
    fr: Rafraîchir
    en: Refresh
  refresh_title:
    fr: Réénumérer les appareils
    en: Re-enumerate devices
  palette_hint:
    fr: Cliquez un appareil pour l'ajouter à la scène.
    en: Click a device to add it to the scene.
  cameras_heading:
    fr: Caméras
    en: Cameras
  microphones_heading:
    fr: Microphones
    en: Microphones
  # Split in two because the sentence wraps `ffmpeg` in a <code> element: a
  # locale file holds copy, never markup, so the markup stays in the template
  # and the copy comes in on either side of it.
  palette_empty_lead:
    fr: >-
      Aucun appareil signalé. Sur un serveur sans écran, c'est attendu. En
      local, vérifiez les autorisations caméra / microphone du système et que
    en: >-
      No devices reported. On a headless server this is expected. Locally,
      check OS camera / microphone permissions and that
  palette_empty_tail:
    fr: est installé.
    en: is installed.

  # --- centre column: the canvas -------------------------------------------
  autofill_button:
    fr: Remplir automatiquement
    en: Auto-populate
  clear_button:
    fr: Vider
    en: Clear
  drag_hint:
    fr: Faites glisser une tuile caméra pour la déplacer.
    en: Drag a camera tile to move it.
  canvas_empty:
    fr: >-
      Scène vide — ajoutez une caméra depuis la palette ou cliquez Remplir
      automatiquement.
    en: Empty scene — add a camera from the palette or hit Auto-populate.

  # --- right column: inspector + scene artifact ----------------------------
  inspector_heading:
    fr: Inspecteur
    en: Inspector
  inspector_empty:
    fr: Choisissez une source pour la modifier.
    en: Select a source to edit it.
  canvas_size_heading:
    fr: Taille du canevas
    en: Canvas size
  width_label:
    fr: largeur
    en: width
  height_label:
    fr: hauteur
    en: height
  scene_artifact_heading:
    fr: Fichier de scène
    en: Scene artifact
  save_button:
    fr: Enregistrer la scène (JSON)
    en: Save scene (JSON)
  load_label:
    fr: Charger une scène…
    en: Load scene…
  show_json_button:
    fr: Afficher le JSON de la scène
    en: Show scene JSON

  # --- language toggle -----------------------------------------------------
  lang_toggle_href:
    fr: /gui?lang=en
    en: /gui?lang=fr
  lang_toggle_flag:
    fr: 🇬🇧
    en: 🇫🇷
  lang_toggle_aria:
    fr: English version
    en: Version française

  # --- strings written by the page's script --------------------------------
  # Templates carry named fields rather than being glued together in
  # JavaScript, so a translator can reorder the sentence (section 21.3.5).
  js_enumerating:
    fr: Énumération des appareils…
    en: Enumerating devices…
  js_api_unreachable:
    fr: 'Impossible de joindre l''API : {error}'
    en: 'Could not reach the API: {error}'
  js_found:
    fr: '{cameras} caméra(s), {mics} microphone(s) trouvés.'
    en: Found {cameras} camera(s), {mics} mic(s).
  js_no_devices:
    fr: Aucun appareil trouvé.
    en: No devices found.
  js_preview_alt:
    fr: Aperçu en direct de {label}
    en: Live preview of {label}
  js_no_live_preview:
    fr: '{label} (pas d''aperçu en direct)'
    en: '{label} (no live preview)'
  js_remove_button:
    fr: Retirer
    en: Remove
  js_label_field:
    fr: libellé
    en: label
  js_z_field:
    fr: z (ordre)
    en: z (order)
  js_saving:
    fr: Enregistrement…
    en: Saving…
  js_save_failed:
    fr: 'Échec de l''enregistrement : {error}'
    en: 'Save failed: {error}'
  js_saved:
    fr: Enregistré et téléchargé.
    en: Saved & downloaded.
  js_loading:
    fr: Chargement…
    en: Loading…
  js_load_failed:
    fr: 'Échec du chargement : {error}'
    en: 'Load failed: {error}'
  js_loaded:
    fr: Scène chargée.
    en: Scene loaded.
  js_autofilling:
    fr: Remplissage automatique depuis le serveur…
    en: Auto-populating from the server…
  js_autofilled:
    fr: Rempli automatiquement.
    en: Auto-populated.
  js_autofill_failed:
    fr: 'Échec du remplissage automatique : {error}'
    en: 'Auto-populate failed: {error}'
