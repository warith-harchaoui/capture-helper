[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capture-helper"
version = "1.6.0"
description = "Capture Helper — local-first, library-shaped camera / microphone capture layer for the AI Helpers stack, with a live multi-source scene configurator GUI. Multi-surface: library + click CLI + FastAPI HTTP surface (+ browser GUI at /gui)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"},
]
keywords = ["capture", "ffmpeg", "camera", "microphone", "webcam", "scene", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    # click: the CLI is built with it and is the only command line this
    # package has, so the dependency cannot be optional either. It used to
    # sit in the [cli] extra beside an always-available argparse CLI.
    "click>=8.1,<9",
    "os-helper>=2.6.0,<4",
    # numpy is needed by camera (frame reshape) and mic (PCM reshape).
    # Lower bound matches the rest of the suite; no upper pin for now.
    "numpy>=1.23",
]

[project.optional-dependencies]
# FastAPI HTTP surface (capture_helper.api). uvicorn + python-multipart
# so multipart form uploads work out of the box.
api = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
# MCP surface (capture_helper.mcp) — fastapi-mcp wraps the FastAPI app, so it
# needs the api extra's runtime deps too.
mcp = [
    "capture-helper[api]",
    "fastapi-mcp>=0.3,<1",
    # Cap the MCP SDK below 2.0: fastapi-mcp 0.4.0 declares only `mcp>=1.12`
    # (no upper bound), but mcp 2.0.0 changed the low-level `Server.__init__`
    # signature and breaks fastapi-mcp at import. Pin to the 1.x line until
    # fastapi-mcp ships a 2.x-compatible release (same issue hit md2star).
    "mcp>=1.12,<2",
]
# `dev` keeps the bar low for CI — pytest + httpx (for FastAPI TestClient)
# + the fastapi/mcp stack so surface-smoke tests can run without extra
# install steps. click is NOT listed here: it is a core dependency now,
# since the CLI it builds is the only one this package has.
dev = [
    "pytest>=8", "pytest-timeout>=2.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fastapi>=0.111,<1",
    "python-multipart>=0.0.9,<1",
    "fastapi-mcp>=0.3,<1",
    "mcp>=1.12,<2",
]

[project.scripts]
# The click CLI — the only command line this package has. click is a core
# dependency (see above), so this entry point needs no extra.
capture-helper = "capture_helper.cli:main"
# MCP server — install with [mcp] extra.
capture-helper-mcp = "capture_helper.mcp:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/capture-helper"
Issues = "https://github.com/warith-harchaoui/capture-helper/issues"

[tool.setuptools.packages.find]
include = ["capture_helper*"]
exclude = ["tests*", "assets*"]

# setuptools ships `.py` files on its own; anything else needs declaring here,
# and the patterns resolve relative to a PACKAGE directory, never to the repo
# root. best-engine declared five data files beside its package and published
# wheels that contained none of them.
[tool.setuptools.package-data]
"capture_helper" = ["locales/*/LC_MESSAGES/*.po", "locales/*/LC_MESSAGES/*.mo"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["assets", "tests"]

[tool.ruff.lint]
# Conservative starter set: pyflakes (F), pycodestyle errors (E), warnings (W),
# isort (I), bugbear (B), comprehensions (C4), pyupgrade (UP), simplify (SIM).
# Easy to tighten later; this is the baseline.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",  # line-too-long — handled by formatter / context-dependent
    "B008",  # function call in argument default — too noisy for our style
    "SIM108",  # ternary preferred over if/else — sometimes hurts readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False in pytest is fine
